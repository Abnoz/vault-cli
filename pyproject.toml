[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vault-cli"
version = "0.1.0"
description = "Python implementation of the Vault secret management CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Vault CLI Maintainers"}]
dependencies = [
    "typer==0.12.5",
    "click==8.1.8",
    "hvac>=2.3.0",
    "rich>=13.7.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "slowapi>=0.1.9",
]

[project.scripts]
"vault-cli" = "vault_cli.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-mock>=3.14.0",
    "ruff==0.6.9",
    "httpx>=0.27.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/vault_cli", "src/vault_core", "src/vault_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
