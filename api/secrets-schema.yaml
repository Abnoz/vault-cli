secrets:
    - name: POSTGRES_SERVER
      type: string
      required: true
      description: PostgreSQL server hostname
    - name: POSTGRES_USER
      type: string
      required: true
      description: PostgreSQL username
    - name: POSTGRES_PASSWORD
      type: string
      required: true
      description: PostgreSQL password
    - name: POSTGRES_DB
      type: string
      required: true
      description: PostgreSQL database name
    - name: POSTGRES_PORT
      type: integer
      required: true
      description: PostgreSQL port number
    - name: REDIS_URL
      type: string
      required: true
      description: Redis connection URL
    - name: CELERY_BROKER_URL
      type: string
      required: true
      description: Celery broker URL
    - name: CELERY_RESULT_BACKEND
      type: string
      required: true
      description: Celery result backend URL
    - name: SECRET_KEY
      type: string
      required: true
      description: Secret key for encryption
    - name: ACCESS_TOKEN_EXPIRE_MINUTES
      type: integer
      required: true
      description: Access token expiration time in minutes
    - name: REFRESH_TOKEN_EXPIRE_MINUTES
      type: integer
      required: true
      description: Refresh token expiration time in minutes
    - name: API_V1_STR
      type: string
      required: true
      description: API version 1 string prefix
    - name: PROJECT_NAME
      type: string
      required: true
      description: Project name
    - name: VERSION
      type: string
      required: true
      description: Project version
    - name: DESCRIPTION
      type: string
      required: true
      description: Project description
    - name: BACKEND_CORS_ORIGINS
      type: string
      required: true
      description: CORS allowed origins
    - name: ENVIRONMENT
      type: string
      required: true
      description: Environment name (development/production)
    - name: DEBUG
      type: boolean
      required: true
      description: Debug mode flag
    - name: LOG_LEVEL
      type: string
      required: true
      description: Logging level
    - name: AZURE_TENANT_ID
      type: string
      required: true
      description: Azure tenant ID
    - name: AZURE_CLIENT_ID
      type: string
      required: true
      description: Azure client ID
    - name: AZURE_CLIENT_SECRET
      type: string
      required: true
      description: Azure client secret
    - name: AZURE_USE_DEFAULT_CREDENTIAL
      type: boolean
      required: false
      description: Use Azure default credentials
    - name: AZURE_AI_FOUNDRY_PROJECT_ENDPOINT
      type: string
      required: true
      description: Azure AI Foundry project endpoint
    - name: AZURE_AI_FOUNDRY_PROJECT
      type: string
      required: true
      description: Azure AI Foundry project name
    - name: AZURE_AI_FOUNDRY_REGULATIONS_RAG_AGENT_ID
      type: string
      required: true
      description: Azure AI Foundry regulations RAG agent ID
    - name: AZURE_AI_FOUNDRY_DOCUMENTS_ANALYZER_AGENT_ID
      type: string
      required: true
      description: Azure AI Foundry documents analyzer agent ID
    - name: AZURE_AI_FOUNDRY_LETTER_RESPONSE_AGENT_ID
      type: string
      required: true
      description: Azure AI Foundry letter response agent ID
    - name: AZURE_AI_FOUNDRY_LEGAL_DOCUMENT_RAG_AGENT_ID
      type: string
      required: true
      description: Azure AI Foundry legal document RAG agent ID
    - name: AZURE_AI_FOUNDRY_JURISPRUDENTIAL_RULES_RAG_AGENT_ID
      type: string
      required: true
      description: Azure AI Foundry jurisprudential rules RAG agent ID
    - name: AZURE_OPENAI_ENDPOINT
      type: string
      required: true
      description: Azure OpenAI endpoint
    - name: AZURE_OPENAI_API_KEY
      type: string
      required: true
      description: Azure OpenAI API key
    - name: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
      type: string
      required: true
      description: Azure OpenAI embedding deployment name
    - name: AZURE_SEARCH_ENDPOINT
      type: string
      required: true
      description: Azure AI Search endpoint
    - name: AZURE_SEARCH_KEY
      type: string
      required: true
      description: Azure AI Search key
    - name: AZURE_SEARCH_REGULATIONS_RAG_INDEX_NAME
      type: string
      required: true
      description: Azure AI Search regulations RAG index name
    - name: AZURE_SEARCH_DOCUMENTS_ANALYZER_INDEX_NAME
      type: string
      required: true
      description: Azure AI Search documents analyzer index name
    - name: JURISPRUDENTIAL_SEARCH_INDEX
      type: string
      required: true
      description: Jurisprudential search index name
    - name: AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
      type: string
      required: true
      description: Azure Document Intelligence endpoint
    - name: AZURE_DOCUMENT_INTELLIGENCE_KEY
      type: string
      required: true
      description: Azure Document Intelligence key
    - name: MARVICK_ENDPOINT
      type: string
      required: true
      description: Llama Maverick endpoint
    - name: MARVICK_API_KEY
      type: string
      required: true
      description: Llama Maverick API key
    - name: MARVICK_MODEL_NAME
      type: string
      required: true
      description: Llama Maverick model name
    - name: MARVICK_DEPLOYMENT_NAME
      type: string
      required: true
      description: Llama Maverick deployment name
    - name: DOC_ANALYZER_CHUNK_SIZE
      type: integer
      required: false
      description: Document analyzer chunk size
    - name: DOC_ANALYZER_CHUNK_OVERLAP
      type: integer
      required: false
      description: Document analyzer chunk overlap
    - name: DOC_ANALYZER_BATCH_SIZE
      type: integer
      required: false
      description: Document analyzer batch size
    - name: DOC_ANALYZER_USE_CHUNKING
      type: boolean
      required: false
      description: Use chunking in document analyzer
    - name: VECTOR_STORE_EXPIRATION_HOURS
      type: integer
      required: false
      description: Vector store expiration hours
    - name: VECTOR_STORE_INDEXING_TIMEOUT_SECONDS
      type: integer
      required: false
      description: Vector store indexing timeout in seconds
    - name: VECTOR_STORE_POLLING_INTERVAL_SECONDS
      type: integer
      required: false
      description: Vector store polling interval in seconds
    - name: MAX_DOCUMENT_SIZE_MB
      type: integer
      required: false
      description: Maximum document size in MB
    - name: SUPPORTED_FILE_TYPES
      type: string
      required: false
      description: Supported file types (JSON array as string)
    - name: AZURE_BLOB_CONNECTION_STRING
      type: string
      required: true
      description: Azure Blob Storage connection string
    - name: STORAGE_PROVIDER
      type: string
      required: true
      description: Storage provider name
    - name: AZURE_BLOB_CONTAINER_NAME
      type: string
      required: true
      description: Azure Blob Storage container name
    - name: TEST_VAR
      type: string
      required: true
      description: Test variable
